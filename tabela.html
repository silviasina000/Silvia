<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Tabela de Classificação</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <style>
    /* Sidebar ocupa toda altura */
    #sidebar {
      width: 220px;
      min-height: 100vh;
    }

    /* Links da sidebar */
    #sidebar .nav-link {
      padding: 10px;
      border-radius: 4px;
      transition: background 0.3s;
    }

    #sidebar .nav-link:hover {
      background-color: #198754;
    }

    #sidebar .nav-link.active {
      background-color: #145c32;
      font-weight: bold;
    }

    /* Ajuste mobile */
    @media (max-width: 768px) {
      #sidebar {
        display: none;
      }
    }

    /* Espaço abaixo da navbar fixa */
    body {
      padding-top: 80px;
      background: #f5f7fa;
    }

    /* Tabela estilizada */
    table {
      border-radius: 8px;
      overflow: hidden;
    }

    thead {
      text-align: center;
    }

    tbody tr:hover {
      background-color: #e9f7ef;
      transition: 0.3s;
    }

    /* Responsividade da tabela */
    .table-responsive {
      margin-top: 20px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: bold;
      color: #145c32;
    }
  </style>
</head>
<body>
  <!-- Navbar fixa -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-success p-3 fixed-top shadow">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html"><i class="bi bi-house"></i> Home</a>
      <!-- Botão hamburguer -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <!-- Links -->
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="registar.html"><i class="bi bi-speedometer2"></i> T1</a></li>
          <li class="nav-item"><a class="nav-link active" href="tabela.html"><i class="bi bi-speedometer2"></i> T2</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Layout principal -->
  <div class="d-flex">
    <!-- Sidebar responsiva -->
    <div class="bg-secondary text-white p-3 d-none d-md-block" id="sidebar">
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link text-white" href="#">1º Trimestre</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="#">2º Trimestre</a></li>
        <li class="nav-item"><a class="nav-link active text-white" href="trmestre.html">3º Trimestre</a></li>
      </ul>
    </div>

    <!-- Conteúdo principal -->
    <main class="p-4 flex-grow-1" id="conteudo">
      <h2>📊 Tabela de Classificação</h2>
      <div class="table-responsive">
        <table class="table table-striped table-hover shadow">
          <thead class="table-success">
            <tr>
              <th>Nome</th><th>Número</th><th>Sala</th><th>Turma</th><th>Disciplina</th>
              <th>Nota 1</th><th>Nota 2</th><th>Nota 3</th><th>Média</th><th>Classificação</th>
            </tr>
          </thead>
          <tbody id="tabelaAluno"></tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Scripts Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const alunos = JSON.parse(localStorage.getItem("alunos")) || [];
    let html = "";

    alunos.forEach(aluno => {
      const media = ((aluno.nota1 + aluno.nota2 + aluno.nota3) / 3).toFixed(2);
      let classificacao = media >= 7 ? "<span class='text-success fw-bold'>Aprovado ✅</span>" : 
                          media >= 5 ? "<span class='text-warning fw-bold'>Recuperação ⚠️</span>" : 
                          "<span class='text-danger fw-bold'>Reprovado ❌</span>";

      html += `
        <tr>
          <td>${aluno.nome}</td>
          <td>${aluno.numeroAluno}</td>
          <td>${aluno.numeroSala}</td>
          <td>${aluno.turma}</td>
          <td>${aluno.disciplina}</td>
          <td>${aluno.nota1}</td>
          <td>${aluno.nota2}</td>
          <td>${aluno.nota3}</td>
          <td><strong>${media}</strong></td>
          <td>${classificacao}</td>
        </tr>
      `;
    });

    document.getElementById("tabelaAluno").innerHTML = html;
  </script>
</body>
</html>
